model:
  model_name_or_path: ${oc.env:MODEL_PATH,output/tinyllava}
  model_id: ${oc.env:MODEL_NAME,null}

data:
  adapter: pope
  question_file: ${oc.env:EVAL_DIR,./eval}/pope/llava_pope_test.jsonl
  image_folder: ${oc.env:EVAL_DIR,./eval}/pope/val2014

generation:
  temperature: 0.0
  top_p: null
  num_beams: 1
  max_new_tokens: 128
  chat_template_path: ${oc.env:EVAL_CHAT_TEMPLATE_PATH,null}

runtime:
  device: null
  batch_size: 1
  num_chunks: 1
  chunk_idx: 0

output:
  answers_file: ${oc.env:EVAL_DIR,./eval}/pope/answers/${oc.env:MODEL_NAME,model}.jsonl
