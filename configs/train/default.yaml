model:
  model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  vision_model_name_or_path: openai/clip-vit-large-patch14-336
  connector_config: configs/connectors/mlp2x_gelu.yaml
  vision_feature_layer: -2
  model_max_length: 2048

data:
  data_path: ${oc.env:TINYLLAVA_DATA,data/train.json}
  image_folder: ${oc.env:TINYLLAVA_IMAGE_FOLDER,data}

training:
  output_dir: output/tinyllava
  precision: auto
  training_strategy: common
  tune_type_llm: frozen
  tune_type_vision_tower: frozen
  tune_type_connector: full
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 1
  save_strategy: steps
  save_steps: 50000
  eval_strategy: "no"
  remove_unused_columns: false
  gradient_checkpointing: true
  report_to: tensorboard
