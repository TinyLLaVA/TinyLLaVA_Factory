# Shared model configuration
model: gemma

stages:
  # Align visual features with the language model.
  pretrain:
    algorithm: sft
    data: llava_558k

    training:
      from: pretrain
      per_device_train_batch_size: 8
      gradient_accumulation_steps: 8

  # Train on instruction-following conversations.
  finetune:
    algorithm: sft
    data: llava_665k

    training:
      from: finetune
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 16
