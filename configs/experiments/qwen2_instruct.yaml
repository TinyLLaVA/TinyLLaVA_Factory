# Shared model configuration
model: qwen2_instruct

stages:
  # Align visual features with the language model.
  pretrain:
    algorithm: sft
    data: llava_558k

    training:
      from: pretrain
      per_device_train_batch_size: 16

  # Train on instruction-following conversations.
  finetune:
    algorithm: sft
    data: llava_665k

    training:
      from: finetune
      per_device_train_batch_size: 4
