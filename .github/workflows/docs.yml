name: Documentation

on:
  pull_request:
    branches: [develop]
    paths:
      - "docs/**"
      - "tinyllava/**"
      - "configs/**"
      - "scripts/train/**"
      - "scripts/eval/**"
      - "pyproject.toml"
      - "README.md"
      - "zensical*.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "tinyllava/**"
      - "configs/**"
      - "scripts/train/**"
      - "scripts/eval/**"
      - "pyproject.toml"
      - "README.md"
      - "zensical*.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (select develop)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.deploy || false }}
  cancel-in-progress: ${{ !inputs.deploy }}

jobs:
  build:
    name: Build bilingual documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require develop for publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref != 'refs/heads/develop' }}
        run: |
          echo '::error::Select develop when publishing documentation.'
          exit 1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up documentation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with documentation extra
        run: |
          python -m pip install -e ".[docs]"
          python -m pip check
      - name: Build and validate the combined site
        run: |
          python -m unittest discover -s docs -p 'test_*.py' -v
          python docs/build.py
      - name: Upload preview site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tinyllava-docs
          path: site/
          if-no-files-found: error
          retention-days: 14

  pages-build:
    name: Prepare GitHub Pages artifact
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Install project with documentation extra
        run: |
          python -m pip install -e ".[docs]"
          python -m pip check
      - name: Build for the actual Pages URL
        env:
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python docs/build.py --base-url "$DOCS_BASE_URL"
      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Publish GitHub Pages
    needs: pages-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
