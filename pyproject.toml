[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyllava"
version = "1.0.0"
description = "A Framework of Small-scale Large Multimodal Models."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "deepspeed>=0.19.2",
    "huggingface-hub>=1.23.0",
    "peft>=0.19.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.13.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
    "gradio>=6.26.0",
    "ninja",
    "numpy",
    "omegaconf",
    "pillow",
    "shortuuid",
    "tensorboardX",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]
docs = [
    "zensical>=0.0.59",
    "mkdocstrings-python>=2.0.8",
    "tomli-w>=1.2.0",
]

[project.urls]
"Homepage" = "https://github.com/TinyLLaVA/TinyLLaVA_Factory"
"Bug Tracker" = "https://github.com/TinyLLaVA/TinyLLaVA_Factory/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]
